name: Build and Push Docker Image

# Chained off release.yml: a tag push (e.g. v2.1.0) triggers release.yml,
# which publishes a GitHub Release from the matching CHANGELOG.md
# section; that Release's "published" event is what triggers this build.
# workflow_dispatch is there for a manual rebuild of the current main
# (e.g. after a base-image security patch, without cutting a new version).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed by anchore/sbom-action to attach the SBOM to the GitHub Release
      actions: read    # needed by anchore/sbom-action for release-asset uploads
      packages: write
      id-token: write  # needed for cosign's keyless signing (uses GitHub's own OIDC token, no private key to manage/leak)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the image name
        id: image
        # github.repository preserves this repo's actual casing
        # (PumbaLP/CrowdSec-Smart-AbuseIPDB-Proxy), but Docker/OCI
        # registries require an all-lowercase repository path — pushing
        # the mixed-case form fails outright ("invalid reference
        # format"). docker-compose.yml pulls the lowercase form, so this
        # has to match it exactly.
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        # Signs by digest, not by a mutable tag like "latest" — the
        # digest is what actually identifies these exact bytes; a tag
        # can be moved to point elsewhere later. Keyless: cosign requests
        # a short-lived certificate from Sigstore's Fulcio CA using this
        # workflow's own GitHub OIDC token as proof of identity, so
        # there's no long-lived private key to generate, store as a
        # secret, or ever worry about leaking.
        run: |
          cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: ${{ github.event_name == 'release' }}

      - name: Attest the SBOM to the image (keyless)
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
